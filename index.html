<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM2 PACS</title>
  <link rel="stylesheet" href="./styles.css?v=20260827-EXATO">
</head>
<body>
<div class="page">
  <main class="shell">
    <section class="brand-exact" id="brandExact" aria-label="AM2 PACS"></section>
    <section class="login-side">
      <div class="login-box">
        <header class="login-head">
          <h2 id="welcomeTitle">Bem-vindo(a) de volta!</h2>
          <p id="welcomeText">Entre com suas credenciais para acessar o sistema.</p>
        </header>
        <div class="error" id="loginError"></div>
        <form id="loginForm" autocomplete="on">
          <div class="group">
            <label for="username">Usuário</label>
            <div class="input">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
              <input id="username" name="username" type="text" placeholder="Digite seu usuário" autocomplete="username" required>
            </div>
          </div>
          <div class="group">
            <label for="password">Senha</label>
            <div class="input">
              <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
              <button type="button" class="eye" id="togglePassword" aria-label="Mostrar senha">
                <svg viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>
          <div class="options" id="forgotArea"><a id="forgotLink" href="#">Esqueceu sua senha?</a></div>
          <button class="submit" type="submit">Entrar</button>
          <div class="security">
            <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            <span>Seus dados estão protegidos<br>em conformidade com a LGPD</span>
          </div>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div id="powered">Tecnologia <strong>AM2 PACS</strong> · Tecnologia para Saúde</div>
    <div>© <span id="year"></span> <span id="company">AM2 Soluções</span></div>
  </footer>
</div>
<script src="./branding.js?v=20260827-EXATO"></script>
<script src="./app.js?v=20260827-EXATO"></script>
</body>
</html>
